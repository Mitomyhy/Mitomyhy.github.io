const PhotoVideoClient = (()=>{
const MAX_IMAGE_BYTES=15*1024*1024;

const MOTIONS=['zoomIn','zoomOut','panLeft','panRight','still'];

function readImageDimensions(buffer,type){

<section class="video-workspace"><div class="video-toolbar"><span data-v="format"></span><span id="video-format"></span></div><div class="video-stage"><div id="video-empty" class="video-empty"><svg viewBox="0 0 80 80" aria-hidden="true"><rect x="6" y="14" width="68" height="52" rx="4"/><path d="m33 28 20 12-20 12Z"/><path d="M16 14v52m48-52v52M6 25h10M6 40h10M6 55h10m48-30h10M64 40h10M64 55h10"/></svg><h2 data-v="empty"></h2><p data-v="emptyBody"></p></div><canvas id="video-canvas" class="video-canvas" hidden></canvas><video id="video-player" class="video-preview" controls playsinline preload="metadata" hidden></video></div><div class="video-preview-actions"><button id="video-preview" class="button" type="button" data-v="preview" disabled></button><a id="video-download" class="button button-dark" download hidden data-v="download"></a></div><div class="video-footer"><span data-v="localInfo"></span><div id="video-status" class="video-status" role="status" aria-live="polite"></div></div></section>`;
$('main').before(app);
let image=null,imageURL='',resultURL='',resultExtension='',exporting=false,reading=false,controller=null,operation=0,previewFrame=0,previewStart=0,playing=false,statusKey='ready',statusRaw='',statusError=false,progress=0;
const support=getExportSupport();
function settings(){return{motion:$('video-motion').value,fit:$('video-fit').value,background:$('video-background').value};}
function dimensions(){return ASPECTS[$('video-aspect').value]||ASPECTS['16:9'];}
function setStatus(key,error=false,raw=''){statusKey=key;statusRaw=raw;statusError=error;renderStatus();}
function renderStatus(){$('video-status').textContent=statusRaw||(tr(statusKey)+(statusKey==='exporting'?` · ${Math.round(progress*100)}%`:''));$('video-status').classList.toggle('is-error',statusError);}
function update(){
  app.querySelectorAll('[data-v]').forEach(node=>node.textContent=tr(node.dataset.v));app.querySelectorAll('[data-v-placeholder]').forEach(node=>node.placeholder=tr(node.dataset.vPlaceholder));
  for(const option of $('video-duration').options)option.textContent=`${option.value} ${tr('seconds')}`;
  app.querySelectorAll('input,select,textarea,button').forEach(node=>node.disabled=exporting||reading);
  $('video-generate').disabled=exporting||reading||!image||!support.supported;$('video-preview').disabled=exporting||reading||!image;$('video-preview').textContent=tr(playing?'pause':'preview');$('video-cancel').disabled=!exporting;$('video-cancel').hidden=!exporting;
  const format=resultExtension||(support.mp4?'mp4':'webm');$('video-format').textContent=tr(format==='mp4'?'mp4':'webmFormat');$('video-codec-note').hidden=format==='mp4';$('video-codec-note').textContent=tr(support.supported?'webm':'noSupport');$('video-canvas').setAttribute('aria-label',tr('previewLabel'));renderStatus();
}
function clearResult(){if(resultURL)URL.revokeObjectURL(resultURL);resultURL='';resultExtension='';const player=$('video-player');player.pause();player.removeAttribute('src');player.load();player.hidden=true;$('video-download').removeAttribute('href');$('video-download').hidden=true;}
function stopPreview(){cancelAnimationFrame(previewFrame);previewFrame=0;playing=false;}
function renderPreview(t=0){if(!image)return;const canvas=$('video-canvas'),size=dimensions(),scale=Math.min(1,640/Math.max(size.width,size.height));const width=Math.round(size.width*scale),height=Math.round(size.height*scale);if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}drawPhotoFrame(canvas.getContext('2d',{alpha:false}),image,settings(),t,width,height);canvas.hidden=false;$('video-empty').hidden=true;}
function previewTick(now){if(!playing||app.hidden||!image||exporting){stopPreview();update();return;}const duration=Number($('video-duration').value)*1000;if(!previewStart)previewStart=now;renderPreview(((now-previewStart)%duration)/duration);previewFrame=requestAnimationFrame(previewTick);}
function showPhoto(){clearResult();stopPreview();renderPreview();update();}
async function openPhoto(file){
  const current=++operation;stopPreview();clearResult();reading=true;setStatus('loading');update();let nextURL='',nextImage=null;
  try{
    validatePhoto(file);readImageDimensions(await file.arrayBuffer(),file.type);nextURL=URL.createObjectURL(file);const decoded=new Image();decoded.decoding='async';decoded.src=nextURL;await decoded.decode();const sourceWidth=decoded.naturalWidth,sourceHeight=decoded.naturalHeight;if(sourceWidth*sourceHeight>24_000_000)throw Error('24 megapixels');
    const size=bitmapSize(sourceWidth,sourceHeight);nextImage=typeof createImageBitmap==='function'?await createImageBitmap(decoded,{resizeWidth:size.width,resizeHeight:size.height,resizeQuality:'high'}):decoded;
    if(current!==operation){nextImage.close?.();URL.revokeObjectURL(nextURL);return;}
    image?.close?.();if(imageURL)URL.revokeObjectURL(imageURL);image=nextImage;imageURL=nextURL;nextURL='';$('video-file-info').textContent=`${file.name} · ${sourceWidth} × ${sourceHeight}`;$('video-file-info').hidden=false;renderPreview();setStatus('loaded');
  }catch(error){if(current===operation)setStatus(/24 megapixel|12,000/.test(error.message)?'pixelError':/15 MiB/.test(error.message)?'fileError':'decodeError',true);}
  finally{if(nextURL)URL.revokeObjectURL(nextURL);if(current===operation){reading=false;update();}}
}
$('video-file').addEventListener('change',()=>{const file=$('video-file').files[0];if(file)void openPhoto(file);});
for(const id of ['video-motion','video-duration','video-aspect','video-fit','video-background'])$(id).addEventListener('change',()=>{if(image)showPhoto();});
$('video-apply').addEventListener('click',()=>{const motion=motionFromBrief($('video-prompt').value);if(!motion){setStatus('briefUnknown',true);return;}$('video-motion').value=motion;if(image)showPhoto();setStatus('briefApplied');});
$('video-preview').addEventListener('click',()=>{if(playing){stopPreview();renderPreview();}else{clearResult();playing=true;previewStart=0;previewFrame=requestAnimationFrame(previewTick);}update();});
$('video-cancel').addEventListener('click',()=>controller?.abort());
$('video-form').addEventListener('submit',async event=>{
  event.preventDefault();if(exporting||reading)return;if(!image){setStatus('noImage',true);return;}if(!support.supported){setStatus('noSupport',true);return;}
  stopPreview();clearResult();const capturedImage=image,capturedSettings=settings(),size=dimensions(),duration=Number($('video-duration').value),current=++operation;controller=new AbortController();exporting=true;progress=0;$('video-progress').value=0;$('video-progress').hidden=false;renderPreview();setStatus('exporting');update();
  try{
    const result=await exportPhotoVideo({image:capturedImage,drawFrame:(ctx,t,width,height)=>drawPhotoFrame(ctx,capturedImage,capturedSettings,t,width,height),duration,fps:24,...size,signal:controller.signal,onProgress:value=>{if(current!==operation)return;progress=Math.min(1,Math.max(0,typeof value==='number'?value:value.progress||0));$('video-progress').value=Math.round(progress*100);renderStatus();}});
    if(current!==operation)return;if(controller.signal.aborted){setStatus('cancelled');return;}if(!(result.blob instanceof Blob)||!result.blob.size)throw Error('No video output.');resultExtension=result.extension==='mp4'?'mp4':'webm';resultURL=URL.createObjectURL(result.blob);$('video-player').src=resultURL;$('video-player').hidden=false;$('video-canvas').hidden=true;$('video-download').href=resultURL;$('video-download').download=`MITOM-photo-video-${new Date().toISOString().replace(/[:.]/g,'-')}.${resultExtension}`;$('video-download').hidden=false;$('video-format').textContent=String(result.extension).toUpperCase()+' · 720p · 24 FPS';setStatus('complete');
  }catch(error){setStatus(error.name==='AbortError'?'cancelled':'error',error.name!=='AbortError');renderPreview();}
  finally{if(current===operation){exporting=false;controller=null;$('video-progress').hidden=true;update();}}
});
function route(){const open=/^#video(?:\/.*)?$/.test(location.hash);app.hidden=!open;document.body.classList.toggle('video-open',open);document.querySelectorAll('.nav-video').forEach(node=>{if(open)node.setAttribute('aria-current','page');else node.removeAttribute('aria-current');});if(open){$('main').hidden=true;$('tools-app').hidden=true;if(image&&!resultURL)renderPreview();}else{stopPreview();$('video-player').pause();update();}}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',event=>{if(!event.persisted){controller?.abort();stopPreview();clearResult();image?.close?.();if(imageURL)URL.revokeObjectURL(imageURL);}});
new MutationObserver(update).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});update();route();
</script>
