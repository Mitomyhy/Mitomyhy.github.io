<!doctype html><meta charset="utf-8"><title>MITOM R5 bounded depth flow QA</title>
<style>body{font:15px/1.6 system-ui;margin:35px;max-width:1000px;background:#f5f5f0;color:#151515}.pass{color:#126232}.fail{color:#b3261e}code{background:#ddd;padding:3px}li{padding:6px}h1{font-size:26px}</style>
<h1>MITOM · bounded browser depth workflow checks</h1><p>Real browser Canvas 2D + production flow module. CPU/model results and WebGL viewer are injected fixtures. No AI downloads, Photoshop or user files. This does not verify MoGe/DA2 inference accuracy.</p>
<p id="summary" role="status">Running…</p><ol id="checks"></ol>
<script type="module">import{runDepthFlowChecks}from'./depth-r5mock-flow.mjs';const results=await runDepthFlowChecks(document,row=>{const li=document.createElement('li');li.className=row.pass?'pass':'fail';li.textContent=(row.pass?'PASS · ':'FAIL · ')+row.name+(row.error?' — '+row.error:'');document.querySelector('#checks').append(li);});const passed=results.filter(row=>row.pass).length;document.querySelector('#summary').textContent=`${passed} / ${results.length} checks passed`;document.body.dataset.result=passed===results.length?'pass':'fail';</script>
